<svg width="600" height="150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="580" height="130" rx="20" ry="20" fill="url(#grad1)" />
  <text x="50%" y="75" font-size="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif">
    <tspan dy="0.3em">Roulette Server</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="1s" repeatCount="indefinite" />
  </text>
  <circle cx="50" cy="120" r="10" fill="white">
    <animate attributeName="cx" values="50;100;50" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="550" cy="30" r="10" fill="white">
    <animate attributeName="cy" values="30;80;30" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>